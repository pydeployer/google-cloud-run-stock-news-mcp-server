[project]
name = "google-cloud-run-stock-news-mcp-server"
version = "0.1.0"
description = "FastMCP stock news server with Alpha Vantage and Finnhub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
